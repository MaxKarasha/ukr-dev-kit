<text x="22" y="123"><tspan>  </tspan><tspan fill="#ff7b72">помилка</tspan><tspan>  </tspan><tspan font-weight="700">greeting</tspan><tspan>  плейсхолдери: бракує {{name}}; зайві {{username}}  </tspan><tspan fill="#8b949e">[placeholder]</tspan></text>
