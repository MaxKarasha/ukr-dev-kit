<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1630"/>
      <stop offset="1" stop-color="#0f2a5a"/>
    </linearGradient>
    <radialGradient id="glowY" cx="0.88" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#ffd500" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffd500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.08" cy="1" r="0.6">
      <stop offset="0" stop-color="#2f7bff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowY)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowB)"/>

  <!-- ліва частина: назва -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="92" font-size="20" font-weight="600" fill="#ffd500" letter-spacing="3">CLAUDE CODE · CODEX · CURSOR · AGENT SKILLS</text>
    <text x="68" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="84" font-weight="700" fill="#ffffff">ukr-dev-kit</text>
    <rect x="72" y="208" width="120" height="8" rx="4" fill="#2f7bff"/>
    <rect x="196" y="208" width="120" height="8" rx="4" fill="#ffd500"/>
    <text x="72" y="268" font-size="36" font-weight="600" fill="#ffffff">Українська мова для AI-агентів</text>
    <text x="72" y="312" font-size="22" fill="#a9b8d9">Озвучка, вичитка, локалізація й українські дані —</text>
    <text x="72" y="342" font-size="22" fill="#a9b8d9">чотири скіли без залежностей, з тестами й CI.</text>
  </g>

  <!-- права частина: чотири картки -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- озвучка -->
    <g transform="translate(810 70)">
      <rect width="190" height="120" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <g fill="#ffd500">
        <rect x="24" y="34" width="8" height="24" rx="4"/>
        <rect x="38" y="24" width="8" height="44" rx="4"/>
        <rect x="52" y="14" width="8" height="64" rx="4"/>
        <rect x="66" y="28" width="8" height="36" rx="4"/>
        <rect x="80" y="20" width="8" height="52" rx="4"/>
        <rect x="94" y="32" width="8" height="28" rx="4"/>
      </g>
      <text x="24" y="104" font-size="21" font-weight="600" fill="#ffffff">Озвучка</text>
    </g>
    <!-- вичитка -->
    <g transform="translate(1020 70)">
      <rect width="190" height="120" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <g stroke="#5b9bff" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M24 26 H96"/>
        <path d="M24 46 H76"/>
        <path d="M24 66 H60"/>
        <path d="M100 56 l14 14 l30 -34" stroke="#3fd68f" stroke-width="9" stroke-linejoin="round"/>
      </g>
      <text x="24" y="104" font-size="21" font-weight="600" fill="#ffffff">Вичитка</text>
    </g>
    <!-- локалізація -->
    <g transform="translate(810 210)">
      <rect width="190" height="120" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <g stroke="#5b9bff" stroke-width="5" fill="none">
        <circle cx="60" cy="46" r="32"/>
        <ellipse cx="60" cy="46" rx="14" ry="32"/>
        <path d="M28 46 H92"/>
      </g>
      <text x="104" y="40" font-size="20" font-weight="700" fill="#ffd500">uk</text>
      <text x="102" y="66" font-size="13" fill="#a9b8d9">one·few·many</text>
      <text x="24" y="104" font-size="21" font-weight="600" fill="#ffffff">Локалізація</text>
    </g>
    <!-- дані -->
    <g transform="translate(1020 210)">
      <rect width="190" height="120" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
        <text x="24" y="38" fill="#a9b8d9">UA21 3223…</text>
        <text x="24" y="62" fill="#a9b8d9">3652504575</text>
        <text x="146" y="62" fill="#3fd68f" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20">✓</text>
      </g>
      <text x="24" y="104" font-size="21" font-weight="600" fill="#ffffff">Дані</text>
    </g>
  </g>
</svg>
