name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Тести (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.12', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Модульні тести
        run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'

  checks:
    name: Структура, валідатори, вичитка власних текстів
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Маніфести й SKILL.md
        run: python tools/validate_skills.py
      - name: Код валідаторів з документації (Python, TypeScript, C#)
        run: python tools/check_validators.py --require-all
      - name: ukr-lint на власній документації
        run: python skills/ukr-proofread/scripts/ukr_lint.py --format github README.md CONTRIBUTING.md CHANGELOG.md skills/*/SKILL.md skills/*/references

  action:
    name: GitHub Action (самоперевірка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: ukr-dev-kit як Action
        uses: ./
        with:
          paths: README.md CONTRIBUTING.md skills/ukr-voice/SKILL.md
          i18n: 'false'
      - name: Action знаходить помилки (очікуємо падіння на навмисному прикладі)
        id: bad
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/bad.md
          i18n: 'false'
      - name: Перевірити, що помилки знайдено
        if: steps.bad.outcome != 'failure'
        run: |
          echo "::error::Action мала впасти на tests/fixtures/bad.md"
          exit 1

  package:
    name: Пакет PyPI (збірка й встановлення)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Версія однакова скрізь
        run: python tools/bump_version.py --check
      - name: Зібрати
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Встановити wheel у чисте оточення й перевірити команди
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/v/bin/ukr-lint --version
          /tmp/v/bin/ukr-data check 3652504575
          /tmp/v/bin/ukr-data amount 1234.56
          /tmp/v/bin/ukr-voice presets > /dev/null
          /tmp/v/bin/ukr-i18n --help > /dev/null
          if /tmp/v/bin/ukr-lint -t "Нажміть тут"; then echo "::error::ukr-lint мав знайти помилку"; exit 1; fi
