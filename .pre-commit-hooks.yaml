- id: ukr-lint
  name: ukr-lint — вичитка українських текстів
  description: Суржик, кальки, типографіка й змішані алфавіти в документації, локалях і рядках коду.
  entry: ukr-lint
  language: python
  types_or: [markdown, text, json, yaml, html, vue, javascript, jsx, ts, tsx, python, xml, pofile]

- id: ukr-lint-fix
  name: ukr-lint --fix — безпечні типографічні виправлення
  entry: ukr-lint --fix
  language: python
  types_or: [markdown, text, json, yaml]

- id: ukr-i18n
  name: ukr-i18n — перевірка української локалізації
  description: Пропущені ключі, плейсхолдери, форми множини, неперекладене.
  entry: ukr-i18n --auto
  language: python
  pass_filenames: false
  always_run: true
